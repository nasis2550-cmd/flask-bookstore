<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎄 เข้าสู่ระบบ / สมัครสมาชิก</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: "Prompt", -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #cc0000 0%, #ff3333 50%, #990000 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      color: white;
    }

    /* ❄️ หิมะตกลงมา */
    .snowflake {
      position: fixed;
      top: -10px;
      z-index: 1;
      user-select: none;
      cursor: default;
      -webkit-user-select: none;
      -moz-user-select: none;
      font-size: 1em;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
      animation: fall linear infinite;
      opacity: 0.8;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Header */
    .header {
      text-align: center;
      margin-top: 40px;
      z-index: 10;
      position: relative;
    }

    .header h1 {
      font-size: 3.5rem;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 0 4px 8px rgba(0, 0, 0, 0.5);
      letter-spacing: 2px;
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 0 4px 8px rgba(0, 0, 0, 0.5); }
      50% { text-shadow: 0 0 40px rgba(255, 255, 255, 0.9), 0 4px 12px rgba(0, 0, 0, 0.7); }
    }

    .header p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #fff;
    }

    /* Auth Container */
    .auth-container {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 450px;
      margin: auto;
      height: auto;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 25px;
      padding: 50px 40px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3),
                  0 0 60px rgba(255, 100, 100, 0.2),
                  inset 0 1px 1px rgba(255, 255, 255, 0.3);
      text-align: center;
    }

    .auth-card h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      color: white;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    .auth-card p {
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 25px;
      font-size: 1rem;
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 15px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .form-group input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 15px rgba(255, 150, 150, 0.4);
    }

    /* Buttons */
    .btn-auth {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #ff4444, #cc0000);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(200, 0, 0, 0.5);
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 10px;
    }

    .btn-auth:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(200, 0, 0, 0.7);
      background: linear-gradient(135deg, #ff6666, #dd1111);
    }

    .btn-auth:active {
      transform: translateY(-1px);
    }

    /* Saved accounts / switcher */
    .account-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .account-bar .who {
      display: flex; align-items: center; gap: 10px;
      font-weight: 600;
    }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff; font-weight: 700;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.4);
    }
    .account-actions { display: flex; gap: 8px; }
    .btn-mini {
      padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.12); color: #fff; cursor: pointer;
      font-weight: 600; transition: background .2s ease, transform .2s ease;
    }
    .btn-mini:hover { background: rgba(255,255,255,0.18); transform: translateY(-1px); }
    .btn-mini.btn-danger { background: rgba(255,80,80,0.35); border-color: rgba(255,120,120,0.55); }
    .btn-mini.btn-danger:hover { background: rgba(255,80,80,0.5); }

    .saved-accounts {
      margin-top: 16px;
      border-top: 1px dashed rgba(255,255,255,0.3);
      padding-top: 12px;
    }
    .saved-accounts h3 { font-size: 16px; margin-bottom: 8px; }
    .account-list { display: grid; grid-template-columns: 1fr; gap: 8px; max-height: 240px; overflow: auto; }
    .account-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22); border-radius: 12px; padding: 10px 12px;
    }
    .account-item .info { display:flex; align-items:center; gap:10px; }
    .account-item .name { font-weight: 600; }
    .account-item .email { font-size: 12px; opacity: .9; }
    .account-item .actions { display:flex; gap:8px; flex-wrap: wrap; }
    .tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.25); }

    /* Fancy dual action row: signup button swaps side */
    .dual-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      transition: justify-content 420ms cubic-bezier(.2,.8,.2,1);
    }
    .dual-actions .btn-ghost {
      flex: 1 1 auto;
      padding: 12px 14px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      letter-spacing: .3px;
      cursor: pointer;
      transition: transform .28s ease, box-shadow .28s ease, background .28s ease;
    }
    .dual-actions .btn-ghost:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,.25);
      background: rgba(255,255,255,0.18);
    }
    /* removed flip/swap animation for the signup button */

    /* Message Box */
    .message {
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
      animation: slideIn 0.4s ease;
    }

    .message.success {
      background: rgba(50, 200, 50, 0.3);
      color: #88ff88;
      border: 1px solid rgba(50, 200, 50, 0.5);
    }

    .message.error {
      background: rgba(255, 100, 100, 0.3);
      color: #ff8888;
      border: 1px solid rgba(255, 100, 100, 0.5);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Footer */
    .footer {
      position: fixed;
      bottom: 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      z-index: 5;
    }

    /* Toggle views */
    .view { display: none; }
    .view.active { display: block; }

    /* Responsive */
    @media (max-width: 480px) {
      .header h1 {
        font-size: 2.5rem;
      }
      .auth-card {
        padding: 35px 25px;
        margin: 0 15px;
      }
      .form-group input {
        padding: 12px 14px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <!-- ❄️ หิมะ -->
  <div id="snowContainer"></div>

  <!-- Header -->
  <div class="header">
    <h1>🎄 ร้านหนังสือ 🎄</h1>
    <p>✨ ยินดีต้อนรับสู่ระบบแนะนำร้านหนังสือในนนทบุรี ✨</p>
  </div>

  <!-- Auth Card -->
  <div class="auth-container">
    <div class="auth-card">
      <h1 id="authTitle">🔐 เข้าสู่ระบบ</h1>
      <p id="authSubtitle">ใส่ชื่อผู้ใช้ หรืออีเมล และรหัสผ่าน</p>

      <div id="messageBox"></div>

      <!-- Login View -->
      <div id="viewLogin" class="view active">
        <div id="currentAccountBar" class="account-bar" style="display:none">
          <div class="who"><span class="avatar" id="currentAvatar">U</span> <span id="currentLabel">คุณเข้าสู่ระบบอยู่</span></div>
          <div class="account-actions">
            <button class="btn-mini" id="btnSwitch">สลับบัญชี</button>
            <button class="btn-mini" id="btnLogout">ออกจากระบบ</button>
          </div>
        </div>
        <form id="loginForm">
          <div class="form-group">
            <label for="user">👤 ชื่อผู้ใช้ / อีเมล</label>
            <input type="text" id="user" placeholder="ชื่อผู้ใช้ หรือ อีเมล" autocomplete="username">
          </div>
          <div class="form-group">
            <label for="password">🔑 รหัสผ่าน</label>
            <input type="password" id="password" placeholder="ใส่รหัสผ่าน" autocomplete="current-password">
          </div>
          <div class="form-group" style="display:flex;align-items:center;gap:8px">
            <input type="checkbox" id="rememberMe" style="width:auto">
            <label for="rememberMe" style="margin:0">เข้าสู่ระบบ</label>
          </div>
          <button type="submit" class="btn-auth" id="btnLogin">เข้าสู่ระบบ</button>
        </form>

        <div class="dual-actions" id="dualActions">
          <button class="btn-ghost" id="btnGoHome" type="button">🏠 กลับหน้าแรก</button>
          <button class="btn-ghost" id="btnToSignup" type="button">✨ สมัครสมาชิก</button>
        </div>

        <div class="saved-accounts" id="savedAccounts" style="display:none">
          <h3>บัญชีที่บันทึกไว้</h3>
          <div class="account-list" id="accountList"></div>
        </div>
      </div>

      <!-- Signup View -->
      <div id="viewSignup" class="view">
        <form id="signupForm">
          <div class="form-group">
            <label for="signupName">👤 ชื่อที่แสดง</label>
            <input type="text" id="signupName" placeholder="เช่น BookLover" autocomplete="nickname">
          </div>
          <div class="form-group">
            <label for="signupEmail">📧 อีเมล</label>
            <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="signupPassword">🔑 รหัสผ่าน</label>
            <input type="password" id="signupPassword" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password" required>
          </div>
          <div class="form-group">
            <label for="signupPassword2">🔁 ยืนยันรหัสผ่าน</label>
            <input type="password" id="signupPassword2" placeholder="พิมพ์รหัสผ่านซ้ำ" autocomplete="new-password" required>
          </div>
          <div class="form-group">
            <label for="signupAvatar">🖼️ รูปโปรไฟล์ (เลือกไฟล์ภาพเล็ก)</label>
            <input type="file" id="signupAvatar" accept="image/*">
          </div>
          <button type="submit" class="btn-auth" id="btnDoSignup">สร้างบัญชี</button>
        </form>
        <div class="dual-actions swap" id="dualActionsSignup">
          <button class="btn-ghost" id="btnBackToLogin" type="button">⬅ กลับไปเข้าสู่ระบบ</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <p>© 2025 ร้านหนังสือในนนทบุรี | 🎄 เฉลิมฉลองไปกับเรา 🎄</p>
  </div>

  <script>
    // ❄️ สร้างหิมะ
    function createSnowflakes() {
      const container = document.getElementById('snowContainer');
      const snowflakeCount = window.innerWidth > 768 ? 80 : 50;
      for (let i = 0; i < snowflakeCount; i++) {
        const snowflake = document.createElement('div');
        snowflake.classList.add('snowflake');
        snowflake.textContent = '❄';
        const size = Math.random() * 20 + 10;
        const duration = Math.random() * 10 + 10;
        const delay = Math.random() * 5;
        const left = Math.random() * 100;
        snowflake.style.fontSize = size + 'px';
        snowflake.style.left = left + '%';
        snowflake.style.animationDuration = duration + 's';
        snowflake.style.animationDelay = delay + 's';
        container.appendChild(snowflake);
      }
    }

    // แสดงข้อความ
    function showMessage(text, type = 'error') {
      const box = document.getElementById('messageBox');
      box.innerHTML = `<div class="message ${type}">${text}</div>`;
      setTimeout(() => { if (box.firstChild) box.innerHTML = '' }, 5000);
    }

    // Utilities: storage + hash
  const STORAGE_KEY_USERS = 'users';
  const STORAGE_KEY_CURRENT = 'currentUser';
  const STORAGE_KEY_SESSIONS = 'sessions';

    function getUsers(){
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY_USERS)) || {}; }
      catch { return {}; }
    }
    function setUsers(obj){ localStorage.setItem(STORAGE_KEY_USERS, JSON.stringify(obj)); }
  function setCurrentUser(user){ localStorage.setItem(STORAGE_KEY_CURRENT, JSON.stringify(user)); }
    function getCurrentUser(){ try { return JSON.parse(localStorage.getItem(STORAGE_KEY_CURRENT)); } catch { return null; } }
  function getSessions(){ try { return JSON.parse(localStorage.getItem(STORAGE_KEY_SESSIONS)) || {}; } catch { return {}; } }
  function setSessions(obj){ localStorage.setItem(STORAGE_KEY_SESSIONS, JSON.stringify(obj)); }
  function isSessionActive(email){ const s=getSessions()[email]; return !!(s && s.expiresAt && s.expiresAt > Date.now()); }

    async function hashText(text){
      const enc = new TextEncoder().encode(text);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }

    function readFileAsDataURL(file){
      return new Promise((resolve,reject)=>{
        const fr = new FileReader();
        fr.onload = ()=> resolve(fr.result);
        fr.onerror = reject;
        fr.readAsDataURL(file);
      });
    }

    // Email check
    function isEmail(x){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x); }

    // Toggle views + animations
    function gotoView(id){
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      const v = document.getElementById(id); if (v) v.classList.add('active');
      const title = document.getElementById('authTitle');
      const sub = document.getElementById('authSubtitle');
      if(id==='viewLogin'){
        title.textContent = '🔐 เข้าสู่ระบบ';
        sub.textContent = 'ใส่ชื่อผู้ใช้ หรืออีเมล และรหัสผ่าน';
      } else {
        title.textContent = '✨ สมัครสมาชิก';
        sub.textContent = 'กรอกอีเมลและรหัสผ่านเพื่อสร้างบัญชีใหม่';
      }
    }

    // โหมดออนไลน์: ใช้ API เซิร์ฟเวอร์เป็นหลัก และ fallback ออฟไลน์เมื่อจำเป็น

    async function handleLoginSubmit(e){
      e.preventDefault();
      const user = document.getElementById('user').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('rememberMe').checked;
      if(!user || !password){ showMessage('⚠️ กรุณากรอกชื่อผู้ใช้และรหัสผ่าน', 'error'); return; }
      // Server login first
      try{
        const payload = isEmail(user) ? { email: user, password } : { username: user, password };
        const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload), credentials:'include' });
        const j = await r.json().catch(()=>({}));
        if(r.ok && j && j.status==='success'){
          // establish local current user for UI convenience
          const profile = { email: j.user.email, username: j.user.username };
          setCurrentUser(profile);
          if(remember){ const s=getSessions(); s[profile.email]= { createdAt:Date.now(), expiresAt: Date.now()+30*24*60*60*1000 }; setSessions(s); }
          showMessage('✅ เข้าสู่ระบบสำเร็จ! กำลังพาไปหน้าแรก...', 'success');
          setTimeout(()=> location.href='home.html', 700);
          return;
        }
        if(j && j.status==='unverified'){
          showMessage('บัญชียังไม่ยืนยันอีเมล กรุณาตรวจอีเมลหรือส่งใหม่จากหน้าโปรไฟล์', 'error');
          return;
        }
      }catch(e){ /* fall back to local */ }

      // Local login fallback
      const users = getUsers();
      const emailKey = isEmail(user) ? user.toLowerCase() : null;
      let foundEmail = emailKey;
      if(!foundEmail){
        // find by display name
        const entry = Object.entries(users).find(([email,info])=> (info.name||'').toLowerCase() === user.toLowerCase());
        if(entry) foundEmail = entry[0];
      }
      if(!foundEmail || !users[foundEmail]){
        showMessage('❌ ไม่พบบัญชี โปรดสมัครสมาชิกก่อน', 'error');
        gotoView('viewSignup');
        return;
      }
      const hash = await hashText(password);
      if(users[foundEmail].hash !== hash){
        showMessage('❌ รหัสผ่านไม่ถูกต้อง', 'error');
        return;
      }
      const profile = { email: foundEmail, username: users[foundEmail].name || foundEmail.split('@')[0], avatar: users[foundEmail].avatar };
      setCurrentUser(profile);
      // Notify server to record login event in database (best-effort)
      try {
        const payload = { identifier: foundEmail, username: profile.username, email: foundEmail, display_name: profile.username };
        fetch('/api/local-login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) }).catch(()=>{});
      } catch(e) {}
      if(remember){ const s=getSessions(); s[foundEmail]= { createdAt:Date.now(), expiresAt: Date.now()+30*24*60*60*1000 }; setSessions(s); }
      showMessage('✅ เข้าสู่ระบบสำเร็จ! กำลังพาไปหน้าแรก...', 'success');
      renderAccountBar();
      renderSavedAccounts();
      setTimeout(()=> location.href='home.html', 700);
    }

    async function handleSignupSubmit(e){
      e.preventDefault();
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim().toLowerCase();
      const pass1 = document.getElementById('signupPassword').value;
      const pass2 = document.getElementById('signupPassword2').value;
      if(!isEmail(email)) { showMessage('⚠️ อีเมลไม่ถูกต้อง', 'error'); return; }
      if(pass1.length < 6) { showMessage('⚠️ รหัสผ่านอย่างน้อย 6 ตัวอักษร', 'error'); return; }
      if(pass1 !== pass2) { showMessage('⚠️ รหัสผ่านไม่ตรงกัน', 'error'); return; }
      // Server signup first
      try {
        const payload = { username: name || email.split('@')[0], email, password: pass1 };
        const r = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload), credentials:'include' });
        const j = await r.json().catch(()=>({}));
        if(r.ok && j && j.status==='success'){
          showMessage('🎉 สมัครสำเร็จ! กำลังเข้าสู่ระบบ...', 'success');
          // After server sets session, go home
          setCurrentUser({ email: j.user.email, username: j.user.username });
          setTimeout(()=> location.href='home.html', 800);
          return;
        } else if (r.status === 409) {
          showMessage(j.message || '⚠️ อีเมลหรือชื่อผู้ใช้ถูกใช้แล้ว', 'error');
          return;
        } else {
          // continue to local fallback below
        }
      } catch(e) { /* fallback to local */ }

      // Local signup: save hashed password and optional avatar
      const users = getUsers();
      if(users[email]){ showMessage('⚠️ อีเมลนี้ถูกใช้แล้ว', 'error'); return; }
      const hash = await hashText(pass1);
      let avatarData = null;
      const avatarFile = document.getElementById('signupAvatar').files && document.getElementById('signupAvatar').files[0];
      if(avatarFile){
        try { avatarData = await readFileAsDataURL(avatarFile); } catch {}
      }
      users[email] = {
        name: name || email.split('@')[0],
        hash,
        createdAt: Date.now(),
        avatar: avatarData || null
      };
      setUsers(users);
      showMessage('🎉 สมัครสำเร็จ! โปรดเข้าสู่ระบบด้วยรหัสที่เพิ่งสร้าง', 'success');
      // Switch to login and prefill
      gotoView('viewLogin');
      document.getElementById('user').value = email;
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
      renderSavedAccounts();
    }

    // Open signup view (animation removed)
    function flipSignup(){
      gotoView('viewSignup');
    }

    async function logout(){
      localStorage.removeItem(STORAGE_KEY_CURRENT); renderAccountBar(); showMessage('ออกจากระบบแล้ว','success');
    }

    function prefillLogin(email){
      const users = getUsers();
      const info = users[email] || {}; 
      document.getElementById('user').value = email;
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
      showMessage(`สลับไปยังบัญชี ${info.name ? info.name : email}`, 'success');
    }

    function renderSavedAccounts(){
      const container = document.getElementById('savedAccounts');
      const listEl = document.getElementById('accountList');
      const users = getUsers();
      const entries = Object.entries(users);
      if(entries.length === 0){ container.style.display='none'; listEl.innerHTML=''; return; }
      container.style.display = '';
      listEl.innerHTML = '';
      entries
        .sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0))
        .forEach(([email, info])=>{
          const row = document.createElement('div'); row.className='account-item';
          const init = (info.name||email).trim()[0]?.toUpperCase() || 'U';
          row.innerHTML = `
            <div class="info">
              <span class="avatar">${info.avatar?`<img src="${info.avatar}" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : init}</span>
              <div>
                <div class="name">${info.name || email.split('@')[0]}</div>
                <div class="email">${email} ${isSessionActive(email)?'<span class="tag">จำไว้</span>':''}</div>
              </div>
            </div>
            <div class="actions">
              ${isSessionActive(email)?'<button class="btn-mini" data-act="instant">เข้าสู่ระบบทันที</button>':''}
              <button class="btn-mini" data-act="switch">สลับไป</button>
              <button class="btn-mini btn-danger" data-act="delete" title="ลบบัญชีนี้">🗑️ ลบ</button>
            </div>`;
          row.querySelectorAll('button').forEach(btn=>{
            btn.addEventListener('click', ()=>{
              const act = btn.getAttribute('data-act');
              if(act==='instant'){
                setCurrentUser({ email, username: info.name || email.split('@')[0] });
                showMessage('✅ เข้าสู่ระบบด้วยบัญชีที่บันทึกไว้', 'success');
                setTimeout(()=> location.href='home.html', 700);
              } else if(act==='switch'){
                prefillLogin(email);
              } else if(act==='delete') {
                if(!confirm('ลบบัญชีนี้ออกจากรายการที่บันทึกไว้?')) return;
                const usersAll = getUsers();
                delete usersAll[email];
                setUsers(usersAll);
                const sessAll = getSessions();
                if(sessAll[email]) { delete sessAll[email]; setSessions(sessAll); }
                const cur = getCurrentUser();
                if(cur && cur.email === email){ localStorage.removeItem(STORAGE_KEY_CURRENT); renderAccountBar(); }
                showMessage('🗑️ ลบบัญชีแล้ว', 'success');
                renderSavedAccounts();
              }
            });
          });
          listEl.appendChild(row);
        });
    }

    function renderAccountBar(){
      const bar = document.getElementById('currentAccountBar');
      const me = getCurrentUser();
      if(me && me.email){
        bar.style.display='';
        const avSpan = document.getElementById('currentAvatar');
        if(me.avatar){
          avSpan.innerHTML = `<img src="${me.avatar}" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
        } else {
          avSpan.textContent = (me.username||me.email)[0].toUpperCase();
        }
        document.getElementById('currentLabel').textContent = `เข้าสู่ระบบเป็น ${me.username||me.email}`;
      } else { bar.style.display='none'; }
    }

    // Init
    async function initAuth(){
      // snow
      createSnowflakes();
      window.addEventListener('resize', () => {
        document.getElementById('snowContainer').innerHTML = '';
        createSnowflakes();
      });

      // โหมดออฟไลน์ ไม่ต้องดึงค่าคอนฟิกจากเซิร์ฟเวอร์

      // if already logged in
      const me = getCurrentUser();
      if(me && me.email){
        // show bar for switching rather than redirect away immediately
        renderAccountBar();
      }

      // wire events
      document.getElementById('loginForm').addEventListener('submit', handleLoginSubmit);
      document.getElementById('signupForm').addEventListener('submit', handleSignupSubmit);
  document.getElementById('btnToSignup').addEventListener('click', flipSignup);
      document.getElementById('btnBackToLogin').addEventListener('click', ()=> gotoView('viewLogin'));
      document.getElementById('btnGoHome').addEventListener('click', ()=> { location.href='home.html'; });
      document.getElementById('btnLogout').addEventListener('click', ()=> { logout(); showMessage('ออกจากระบบแล้ว', 'success'); });
      document.getElementById('btnSwitch').addEventListener('click', ()=> { gotoView('viewLogin'); renderSavedAccounts(); document.getElementById('savedAccounts').scrollIntoView({behavior:'smooth'}); });

      renderSavedAccounts();
    }

    document.addEventListener('DOMContentLoaded', initAuth);
  </script>
</body>
<script src="profile.js" defer></script>
<script src="avatar_crop.js" defer></script>
</html>
