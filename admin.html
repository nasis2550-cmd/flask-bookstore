<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ผู้ดูแล — ร้านหนังสือนนทบุรี</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Drag-and-drop styling */
    .drag-handle{display:inline-block;font-size:14px;opacity:.6;cursor:grab;margin-right:6px}
    .drag-handle:active{cursor:grabbing;opacity:.9}
    .shop-row.dragging{background:#fff0d6;outline:2px dashed #f1a855}
    tbody tr.shop-row{transition:background-color .12s ease}
  </style>
  <!-- Google Maps API for geocoding; falls back to OSM if unavailable -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBGf_fqp0K88MfZ51RNeGBrqFUWLJ5VJHM" defer></script>
</head>
<body class="bookstore" style="padding:20px">
  <header>
    <h2>จัดการร้านหนังสือ</h2>
    <div class="muted">เพิ่ม/แก้ไข/ลบร้าน โดยบันทึกลงฐานข้อมูล `website.db` ตาราง `shops`</div>
    <div style="margin-top:10px">
      <button class="btn" onclick="location.href='home.html'">← กลับหน้าแรก</button>
      <button class="btn" onclick="location.href='admin_logs.html'">📜 บันทึกระบบ</button>
    </div>
  </header>

  <section style="margin-top:16px">
    <div class="paper-bg" style="padding:16px;border-radius:10px">
      <h3 style="margin-top:0">เพิ่มร้านใหม่</h3>
      <form id="createForm" onsubmit="return false" style="display:grid;grid-template-columns:repeat(2, minmax(240px, 1fr));gap:10px">
        <input placeholder="ชื่อร้าน*" id="f_name">
        <input placeholder="คำอธิบาย (option)" id="f_desc">
        <input placeholder="ที่อยู่ (option)" id="f_address">
        <input placeholder="คะแนน 0-5 (option)" id="f_rating" type="number" step="0.1" min="0" max="5">
        <input placeholder="รูปภาพ URL (option)" id="f_image">
        <input placeholder="ละติจูด (auto)" id="f_lat" readonly>
        <input placeholder="ลองจิจูด (auto)" id="f_lng" readonly>
        <div style="grid-column: 1 / -1; display:flex; align-items:center; gap:10px; flex-wrap:wrap">
          <input type="file" id="f_image_file" accept="image/*">
          <img id="f_image_preview" alt="ตัวอย่างรูปภาพ" style="max-height:90px; border-radius:6px; display:none">
        </div>
      </form>
      <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center">
        <button class="btn" onclick="Admin.autoGeocode()" type="button" style="display:inline-block">📍 ดึงพิกัดอัตโนมัติ</button>
        <button class="btn" onclick="Admin.useMyLocation()" type="button" style="display:inline-block">📌 ใช้ตำแหน่งฉัน</button>
        <button class="btn" onclick="Admin.create()">➕ เพิ่มร้าน</button>
        <span id="geoStatus" class="muted" style="margin-left:6px"></span>
      </div>
    </div>
  </section>

  <section style="margin-top:20px">
    <h3>ร้านทั้งหมด</h3>
    <div id="storesTable" class="paper-bg" style="padding:12px;border-radius:10px"></div>
  </section>

  <section style="margin-top:20px">
    <h3>บันทึกอินพุต/คอมเม้นต์</h3>
    <div id="inputsBox" class="paper-bg" style="padding:12px;border-radius:10px"></div>
  </section>

  <script>
    // อัปโหลดรูปไปยังเซิร์ฟเวอร์และตั้งค่า URL อัตโนมัติ
    const fileInputHandler = async () => {
      const fileEl = document.getElementById('f_image_file');
      const file = fileEl.files?.[0];
      const urlInput = document.getElementById('f_image');
      const preview = document.getElementById('f_image_preview');
      if (!file) { preview.style.display = 'none'; preview.src = ''; return; }
      try {
        const fd = new FormData();
        fd.append('file', file);
        const r = await fetch('/api/upload-image', { method:'POST', body: fd });
        const j = await r.json().catch(()=>({}));
        if(r.ok && j && j.url){
          urlInput.value = j.url; preview.src = j.url; preview.style.display = 'inline-block';
          return;
        }
      } catch(e) { /* fallback to data URL below */ }
      // หากอัปโหลดล้มเหลว ให้ใช้ data URL เป็นตัวสำรอง
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        if (typeof dataUrl === 'string') { urlInput.value = dataUrl; preview.src = dataUrl; preview.style.display = 'inline-block'; }
      };
      reader.readAsDataURL(file);
    };
    document.addEventListener('DOMContentLoaded', () => {
      const f = document.getElementById('f_image_file');
      if (f) f.addEventListener('change', fileInputHandler);
    });
  </script>
  <script src="admin.js" defer></script>
</body>
</html>
