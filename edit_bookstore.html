<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>แก้ไขร้านหนังสือ | ร้านหนังสือนนทบุรี</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body.bookstore{background:radial-gradient(circle at top,#14182b,#05060f)}
    .form-shell{max-width:1150px;margin:24px auto;padding:10px 22px;display:grid;gap:26px;grid-template-columns:minmax(360px,1fr) 320px}
    .panel{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:28px;color:#f3f6ff;box-shadow:0 20px 40px rgba(0,0,0,0.35);backdrop-filter:blur(16px)}
    .panel h1{margin-top:0;font-size:28px}
    label.field{display:flex;flex-direction:column;font-size:13px;margin-bottom:14px;font-weight:500;gap:6px}
    input,textarea,select{
      border-radius:16px;
      border:1px solid rgba(21,35,66,0.2);
      background:#ffffff;
      color:#0f1b2d;
      padding:12px;
      font-family:'Prompt',sans-serif;
      box-shadow:0 4px 14px rgba(10,21,46,0.08);
      transition:border-color .2s,box-shadow .2s;
    }
    textarea{min-height:110px;resize:vertical}
    input::placeholder,textarea::placeholder,select::placeholder{color:rgba(15,27,45,0.45)}
    input:focus,textarea:focus,select:focus{
      outline:none;
      border-color:#7dc9ff;
      box-shadow:0 0 0 3px rgba(125,201,255,0.35);
      background:#fff;
      color:#0b1529;
    }
    .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .form-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
  .upload-zone{margin-top:16px;padding:14px;border:1px dashed rgba(255,255,255,0.25);border-radius:18px;background:rgba(255,255,255,0.04);text-align:center}
    .btn-primary{padding:12px 30px;border-radius:24px;border:none;background:linear-gradient(110deg,#78f0ff,#7c84ff);color:#0b1126;font-weight:600;cursor:pointer}
    .btn-danger{background:rgba(255,99,132,0.18);border:1px solid rgba(255,99,132,0.45);color:#ffb4c6;border-radius:20px;padding:10px 22px;cursor:pointer}
    .note{font-size:13px;opacity:.75}
    .preview-panel{background:rgba(0,0,0,0.35);border-radius:22px;padding:22px;border:1px solid rgba(255,255,255,0.06);color:#eaf0ff}
    .preview-panel img{width:100%;border-radius:18px;display:none;object-fit:cover;min-height:220px;background:#080b18}
  .form-status{margin-top:18px;min-height:32px}
  .msg{padding:10px 14px;border-radius:12px;font-size:13px}
    .msg.ok{background:rgba(77,214,120,0.18);color:#7dffb4;border:1px solid rgba(77,214,120,0.5)}
    .msg.err{background:rgba(246,97,97,0.14);color:#ff9f9f;border:1px solid rgba(246,97,97,0.45)}
    .msg.info{background:rgba(126,150,255,0.14);color:#b0c5ff;border:1px solid rgba(126,150,255,0.4)}
    @media(max-width:980px){
      .form-shell{grid-template-columns:1fr}
    }
  </style>
</head>
<body class="bookstore">
  <header class="subheader">
    <div class="header-inner">
      <div class="header-left">
        <button class="btn ghost" onclick="location.href='home.html'">⬅ กลับหน้าหลัก</button>
        <h1 style="margin:0 0 0 14px;font-size:24px">แก้ไขข้อมูลร้าน</h1>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="location.href='add_bookstore.html'">➕ เพิ่มร้านใหม่</button>
      </div>
    </div>
  </header>

  <main class="form-shell">
    <section class="panel">
      <h1>เลือกร้านและอัปเดต</h1>
      <div class="form-grid">
        <label class="field">เลือกร้านที่ต้องการแก้ไข
          <select id="storePicker">
            <option value="">กำลังโหลด...</option>
          </select>
        </label>
        <label class="field">Manager Key
          <input type="password" id="editManagerKey" placeholder="จำเป็นสำหรับบันทึก">
          <small class="note">คีย์จะถูกเก็บใน sessionStorage และใช้กับทุกการแก้ไข</small>
        </label>
      </div>
      <form id="bookstoreForm" data-mode="edit">
        <div class="form-grid">
          <label class="field">ชื่อร้าน<input type="text" name="name" required></label>
          <label class="field">เบอร์โทรศัพท์<input type="text" name="phone"></label>
          <label class="field">เวลาเปิด-ปิด<input type="text" name="hours"></label>
          <label class="field">แท็ก / หมวดหมู่<input type="text" name="tags"></label>
          <label class="field">คะแนน (0-5)<input type="number" name="rating" min="0" max="5" step="0.1"></label>
        </div>
        <label class="field">ที่อยู่<textarea name="address"></textarea></label>
        <label class="field">คำอธิบายร้าน<textarea name="description"></textarea></label>
        <div class="form-grid">
          <label class="field">Latitude<input type="text" name="latitude"></label>
          <label class="field">Longitude<input type="text" name="longitude"></label>
        </div>
        <div class="form-actions">
          <button type="button" class="btn" id="autoLocation">📍 ใช้ตำแหน่ง</button>
          <span class="note" id="locationPreview">📍 ยังไม่กำหนดพิกัด</span>
        </div>
        <div class="upload-zone">
          <div>อัปโหลดรูปใหม่ (ถ้าต้องการอัปเดตภาพ)</div>
          <input type="file" id="imageInput" accept="image/*">
          <input type="hidden" name="image_url">
          <input type="hidden" name="image_thumb_url">
        </div>
        <div class="form-actions" style="justify-content:flex-end">
          <button type="submit" class="btn-primary">บันทึกการแก้ไข</button>
        </div>
        <div id="formStatus" class="form-status"></div>
      </form>
    </section>

    <aside class="preview-panel">
      <h2>ตัวอย่างภาพล่าสุด</h2>
      <img id="imagePreview" alt="ภาพร้าน">
      <div class="note" style="margin-top:14px">
        • ระบบจะสร้าง thumb และขนาดกลางให้อัตโนมัติ<br>
        • หากไม่อัปโหลดใหม่ ระบบใช้รูปเดิม
      </div>
    </aside>
  </main>

  <script src="bookstore_form.js" defer></script>
</body>
</html>
